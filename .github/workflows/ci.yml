name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseding a PR check is free — only the latest commit's result matters.
# Superseding a push to main is not: that run BUILDS AND DEPLOYS, and each run
# only covers the diff since the previous commit. Cancelling one therefore drops
# its changes on the floor permanently, because the next push diffs against the
# commit that was cancelled and never revisits it.
#
# That is not theoretical. A commit adding a new photo had its build cancelled
# by the content-only commit behind it; that second run correctly skipped
# building (content reaches the site without one), so the photo was never
# compiled into the image ladder and the site served the unoptimised runtime
# copy indefinitely.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build affected sites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Write access is only for the image-optimization commit at the end of the
    # run; nothing else here pushes.
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Full history: Turborepo works out which packages changed by diffing
        # against the base commit, which a shallow clone cannot reach.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Astro re-encodes every image variant it has not seen before, and
      # TreePicture asks for AVIF + WebP + JPEG at four widths apiece. On a cold
      # runner that IS the build: a CMS content edit spent 2m57s of a 3m21s run
      # here, while install took two seconds. Restoring Astro's cache is
      # therefore the only change worth making — locally the same build goes
      # 35.4s cold to 15.8s warm.
      #
      # Restored AFTER `bun install`, because the cache lives inside
      # node_modules and install must not race with unpacking it.
      #
      # The cache is content-addressed by Astro, so one restored from an older
      # commit is still correct: entries it no longer needs are ignored, and
      # anything new is encoded as usual. That makes the key rolling — save
      # under this commit, restore whatever the most recent run left behind.
      - name: Restore Astro image cache
        id: astro_cache
        uses: actions/cache/restore@v4
        with:
          path: sites/*/node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-assets-${{ runner.os }}-

      # A photograph uploaded through /keystatic bypasses `bun run import-photo`
      # entirely: in production the CMS commits it straight to main from the
      # editor's browser, at whatever size their camera produced, and this is
      # the first machine that ever sees it. Re-encode it here — before the
      # build, so the site ships the optimized file — and push the result back
      # at the end of the run so the repo stops carrying the original.
      - name: Optimize oversized images
        id: optimize
        run: |
          node scripts/optimize-images.mjs --changed-list "$RUNNER_TEMP/optimized-files.txt"
          if [ -s "$RUNNER_TEMP/optimized-files.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Re-encoded oversized image(s) — see the step log."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Which commit to diff against. A pull request compares with its base
      # branch; a push compares with whatever was on the branch before it. The
      # all-zeroes SHA means the branch is brand new (nothing to diff), so the
      # build falls back to every package.
      - name: Resolve diff base
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      # Ask turbo which packages the diff touches before building, then keep the
      # ones that are sites opted into deploys. A site opts in with
      #
      #   "deploy": { "enabled": true }                     in its package.json
      #   "deploy": { "enabled": true, "projectName": "…" } for a Pages site
      #
      # so adding a site to the pipeline is one field, not a workflow edit.
      - name: Work out affected packages
        id: affected
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          # node rather than jq: node is already required by the build, so this
          # cannot break on a runner image that ships without jq.
          if [ -z "$TURBO_SCM_BASE" ]; then
            bun run turbo build --dry=json > turbo-dry.json 2>/dev/null
          else
            bun run turbo build --affected --dry=json > turbo-dry.json 2>/dev/null
          fi
          PACKAGES=$(node -p "require('./turbo-dry.json').packages.join(' ')")
          rm -f turbo-dry.json
          echo "affected: $PACKAGES"

          DEPLOYABLE=""
          for pkg in $PACKAGES; do
            manifest="sites/$pkg/package.json"
            [ -f "$manifest" ] || continue
            if [ "$(node -p "(require('./$manifest').deploy || {}).enabled === true")" = "true" ]; then
              DEPLOYABLE="$DEPLOYABLE $pkg"
            fi
          done
          DEPLOYABLE=$(echo "$DEPLOYABLE" | xargs || true)
          echo "deployable: ${DEPLOYABLE:-<none>}"

          # A site marked `deploy.runtimeContent` reads its content from KV at
          # request time, and a webhook syncs it seconds after the commit — so a
          # commit that touches nothing but that site's src/content/ is already
          # live and rebuilding it would only redeploy identical code.
          #
          # The bar for skipping is deliberately high. Anything changed outside
          # sites/ — packages/, scripts/, root config — can change what a site
          # renders, so it disables skipping for everyone. Another site's files
          # cannot, since sites share code only through packages/.
          SKIPPED=""
          if [ -n "$TURBO_SCM_BASE" ] && [ -n "$DEPLOYABLE" ]; then
            CHANGED=$(git diff --name-only "$TURBO_SCM_BASE" "$TURBO_SCM_HEAD" || true)
            OUTSIDE=$(printf '%s\n' "$CHANGED" | grep -v '^sites/' | head -1 || true)

            if [ -n "$OUTSIDE" ]; then
              echo "changes outside sites/ ($OUTSIDE) — building everything affected"
            else
              KEEP=""
              for site in $DEPLOYABLE; do
                runtime=$(node -p "(require('./sites/$site/package.json').deploy || {}).runtimeContent === true")
                noncontent=""
                if [ "$runtime" = "true" ]; then
                  noncontent=$(printf '%s\n' "$CHANGED" \
                    | grep "^sites/$site/" \
                    | grep -v "^sites/$site/src/content/" | head -1 || true)
                fi
                if [ "$runtime" = "true" ] && [ -z "$noncontent" ]; then
                  echo "::notice::$site: content-only change — already live via the content webhook, skipping build and deploy."
                  SKIPPED="$SKIPPED $site"
                else
                  KEEP="$KEEP $site"
                fi
              done
              DEPLOYABLE=$(echo "$KEEP" | xargs || true)
              SKIPPED=$(echo "$SKIPPED" | xargs || true)
            fi
          fi

          echo "to deploy: ${DEPLOYABLE:-<none>}"
          echo "skipped:   ${SKIPPED:-<none>}"
          echo "sites=$DEPLOYABLE" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

      # Deploying needs Cloudflare credentials, and any site running Keystatic
      # also needs the app slug: it is a PUBLIC_ variable, compiled into the
      # admin bundle at BUILD time, so deploying a build made without it ships a
      # CMS whose sign-in links point nowhere. Fail loudly rather than ship that.
      - name: Check deploy prerequisites
        id: deploy_ready
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          SITES: ${{ steps.affected.outputs.sites }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$SITES" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_CLOUDFLARE" != "true" ]; then
            echo "::notice::Cloudflare credentials not configured — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for site in $SITES; do
            [ -f "sites/$site/keystatic.config.ts" ] || continue
            # A site's own variable satisfies this as well as the shared one —
            # otherwise a fleet that has moved entirely to per-site apps would
            # fail on an empty default it no longer uses.
            key="PUBLIC_KEYSTATIC_GITHUB_APP_SLUG_$(echo "$site" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')"
            slug=$(node -e "const v=JSON.parse(process.env.ALL_VARS); process.stdout.write(v['$key'] || v.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG || '')")
            if [ -z "$slug" ]; then
              echo "::error::$site runs Keystatic but neither $key nor PUBLIC_KEYSTATIC_GITHUB_APP_SLUG is set. The slug is inlined at build time, so deploying without it ships a CMS whose Install-GitHub-App links point nowhere."
              exit 1
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # `--affected` builds only the packages touched since the base commit,
      # plus anything that depends on them — so a CMS edit under
      # sites/<domain>/src/content/ rebuilds that one site, while a change in
      # packages/shared-ui still rebuilds every site that consumes it.
      # A site whose Keystatic app is not the fleet default declares its own
      # slug as PUBLIC_KEYSTATIC_GITHUB_APP_SLUG_<SITE> (dots and dashes to
      # underscores, upper-cased): test-1.com uses its own GitHub App, so
      # PUBLIC_KEYSTATIC_GITHUB_APP_SLUG_TEST_1_COM.
      #
      # It cannot simply be exported for the whole run. The slug is compiled
      # INTO each admin bundle, and one turbo invocation carries one value for
      # a variable — so a site with its own app has to be built on its own.
      # Everything else still builds together, in parallel, as before.
      - name: Work out per-site Keystatic slugs
        id: slugs
        env:
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          overrides=""
          for dir in sites/*/; do
            site=$(basename "$dir")
            key="PUBLIC_KEYSTATIC_GITHUB_APP_SLUG_$(echo "$site" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')"
            value=$(node -e "process.stdout.write((JSON.parse(process.env.ALL_VARS)['$key'] || ''))")
            if [ -n "$value" ]; then
              echo "$site -> $value"
              overrides="$overrides $site"
            fi
          done
          overrides=$(echo "$overrides" | xargs || true)
          echo "sites with their own app: ${overrides:-<none>}"
          echo "overrides=$overrides" >> "$GITHUB_OUTPUT"

      # `--affected` builds only the packages touched since the base commit,
      # plus anything that depends on them — so a CMS edit under
      # sites/<domain>/src/content/ rebuilds that one site, while a change in
      # packages/shared-ui still rebuilds every site that consumes it.
      - name: Build affected packages
        env:
          TURBO_SCM_BASE: ${{ steps.diff.outputs.base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          # The fleet default. Sites listed in `overrides` are excluded here and
          # rebuilt below with their own value.
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
          OVERRIDES: ${{ steps.slugs.outputs.overrides }}
          SKIPPED: ${{ steps.affected.outputs.skipped }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          # Excluded for two different reasons: a site with its own Keystatic app
          # is built separately below, and a site whose content-only change is
          # already live is not built at all.
          exclude=""
          for site in $OVERRIDES $SKIPPED; do exclude="$exclude --filter=!$site"; done

          if [ -z "$TURBO_SCM_BASE" ]; then
            echo "No diff base — building every package."
            # shellcheck disable=SC2086
            bun run turbo build $exclude
          else
            # shellcheck disable=SC2086
            bun run turbo build --affected $exclude
          fi

          # Each site with its own GitHub App, built on its own so its slug is
          # the one that lands in its bundle. `--affected` still applies, so a
          # site nobody touched is a no-op here rather than a rebuild.
          for site in $OVERRIDES; do
            case " $SKIPPED " in *" $site "*) echo "$site: skipped (content-only)"; continue;; esac
            key="PUBLIC_KEYSTATIC_GITHUB_APP_SLUG_$(echo "$site" | tr '[:lower:]' '[:upper:]' | tr '.-' '__')"
            slug=$(node -e "process.stdout.write((JSON.parse(process.env.ALL_VARS)['$key'] || ''))")
            echo "::group::build $site (app: $slug)"
            if [ -z "$TURBO_SCM_BASE" ]; then
              PUBLIC_KEYSTATIC_GITHUB_APP_SLUG="$slug" bun run turbo build --filter="$site"
            else
              PUBLIC_KEYSTATIC_GITHUB_APP_SLUG="$slug" bun run turbo build --affected --filter="$site"
            fi
            echo "::endgroup::"
          done

      # A commit that touches no site — a workflow edit, a docs change — leaves
      # `--affected` with nothing to build and no cache directory behind. Asking
      # cache/save to store a path that does not exist is not harmful (it
      # declines rather than storing an empty entry, so the prefix restore above
      # cannot be poisoned by it) but it does print
      # "##[warning]Cache save failed", which reads like a broken build. Check
      # first instead. A directory test is O(1); `hashFiles` would walk ~2000
      # files to answer the same question.
      - name: Is there an image cache to save?
        id: astro_cache_state
        run: |
          if ls -d sites/*/node_modules/.astro >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false  (nothing was built)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Saved straight after the build, before deploy, so the work is kept even
      # if a later step fails. The restore key above is unique per commit, so an
      # exact hit is only possible on a re-run of the same commit — every other
      # run writes a fresh entry and GitHub evicts the oldest once the repo
      # passes its cache limit. ~62 MB per entry for this repo.
      - name: Save Astro image cache
        if: >-
          steps.astro_cache.outputs.cache-hit != 'true' &&
          steps.astro_cache_state.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: sites/*/node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ github.sha }}

      # Fails the build if any IMAGE in the repo or in a site's dist/ is over
      # 1 MB — the guard that keeps unprocessed photography out of the repo.
      # Deliberately unscoped as to path: it also guards files no build touches.
      # The step above repairs raster photographs, so anything surviving to here
      # is either a vector/animated image or a source no re-encode could save.
      #
      # Oversized NON-image files (the Keystatic admin bundle, the Worker
      # bundle) are reported as warnings and do not fail the run. Both lists are
      # emitted as workflow commands, so they land on the run summary as
      # annotations rather than only in this step's log.
      - name: Check file size budget
        run: bun run check:sizes

      # How a site ships is read from what it just built, not from a list kept
      # here: a site carrying the Cloudflare adapter emits
      # dist/server/wrangler.json and goes out as a Worker (assets + on-demand
      # routes); everything else is static and goes to Pages. Secrets already
      # set on a Worker (Keystatic OAuth, GITHUB_TOKEN, Turnstile) survive a
      # deploy untouched.
      #
      # This is what closes the loop on CMS edits: Keystatic commits to main,
      # that push lands here, and the site rebuilds and redeploys itself.
      - name: Deploy affected sites
        if: steps.deploy_ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITES: ${{ steps.affected.outputs.sites }}
        run: |
          for site in $SITES; do
            dir="sites/$site"
            worker_config="$dir/dist/server/wrangler.json"
            echo "::group::deploy $site"
            if [ -f "$worker_config" ]; then
              echo "$site -> Cloudflare Workers"
              bunx wrangler deploy --config "$worker_config"
            else
              project=$(node -p "(require('./$dir/package.json').deploy || {}).projectName || ''")
              if [ -z "$project" ]; then
                echo "::error::$site built no worker config, so it deploys to Pages — add deploy.projectName to $dir/package.json."
                exit 1
              fi
              echo "$site -> Cloudflare Pages ($project)"
              bunx wrangler pages deploy "$dir/dist" --project-name="$project" --branch=main
            fi
            echo "::endgroup::"
          done

      # Persist the re-encoded images, but only once everything above has
      # passed — a failed run leaves the repo exactly as it was.
      #
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot
      # loop back into another CI run. If `main` is protected against direct
      # pushes the push is refused; that is not worth failing a green build
      # over, since the deployed site already carries the optimized images and
      # the next run simply optimizes them again.
      - name: Commit optimized images
        if: github.event_name == 'push' && steps.optimize.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [ -n "$path" ] && git add -A -- "$path"
          done < "$RUNNER_TEMP/optimized-files.txt"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m 'chore: optimize images over the 1 MB budget'
          git push origin "HEAD:${GITHUB_REF_NAME}" || \
            echo "::warning::Could not push the optimization commit (branch protection?). The deployed build is optimized; the repo still holds the original."
