paths:
  uploads: sites/test-3.com/public/media
  uploads_use_relative_path: false
  static: sites/test-3.com/public
collections_config:
  pages:
    path: sites/test-3.com/src/content/pages
    glob:
      - '**/*.md'
    name: Pages
    icon: web
    url: '{permalink}'
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
    _enabled_editors:
      - visual
      - data
    _inputs:
      title:
        type: text
        label: SEO title
        comment: >-
          Shown in the browser tab and in search results. Aim for 60 characters
          or fewer.
        cascade: true
      description:
        type: textarea
        label: SEO description
        comment: The snippet search engines show. Aim for 155 characters or fewer.
        cascade: true
      keywords:
        type: array
        label: SEO keywords
        cascade: true
      permalink:
        type: text
        label: Output URL
        comment: >-
          The live URL of this page. Changing it will not move the route — edit
          src/pages/ for that.
        cascade: true
        disabled: true
      breadcrumb:
        type: array
        options:
          structures: _structures.breadcrumb_items
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Breadcrumb trail
        cascade: true
      hero:
        type: object
        label: Hero
        cascade: true
      trust_items:
        type: array
        options:
          structures: _structures.trust_items
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Trust bar items
        cascade: true
      features:
        type: array
        options:
          structures: _structures.cards
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Feature cards
        cascade: true
      services:
        type: array
        options:
          structures: _structures.cards
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Service cards
        cascade: true
      link_text:
        type: text
        label: Link text
        cascade: true
      team:
        type: object
        label: Team panel
        cascade: true
      members:
        type: array
        options:
          structures: _structures.team_members
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Team members
        cascade: true
      form:
        type: object
        label: Contact form
        cascade: true
      action:
        type: text
        label: Form action URL
        cascade: true
      cta:
        type: object
        label: Closing call to action
        cascade: true
      variant:
        type: select
        options:
          allow_empty: true
          values:
            - dark
            - light
          required: false
        label: Colour scheme
        cascade: true
      empty_state:
        type: text
        label: Empty blog message
        cascade: true
      back_link:
        type: object
        label: Back link
        cascade: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  posts:
    path: sites/test-3.com/src/content/posts
    glob:
      - '**/*.md'
    name: Blog Posts
    icon: newspaper
    url: /blog/[full_slug]/
    disable_url: false
    include_developer_files: false
    preview:
      text:
        - key: title
      metadata:
        - text:
            - template: '{date|date_long}'
            - No date
          icon: calendar_month
    _enabled_editors:
      - content
      - visual
    _inputs:
      title:
        type: text
        comment: Also used as the page title and the link text elsewhere on the site.
        cascade: true
      date:
        type: date
        cascade: true
      description:
        type: textarea
        comment: Shown on the blog index card and as the SEO description.
        cascade: true
      draft:
        type: switch
        comment: Drafts are excluded from the build.
        cascade: true
    add_options:
      - name: Add New Post
        icon: post_add
        editor: content
        schema: default
    create:
      path: '[relative_base_path]/{title|slugify|lowercase}.md'
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/test-3-post.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
        name: New Post
  site:
    path: sites/test-3.com/src/data
    glob:
      - '**/*.json'
    name: Site Settings
    icon: settings
    disable_url: true
    include_developer_files: false
    _inputs:
      site_name:
        type: text
        label: Site name
        comment: Used in the header, the footer and the copyright line.
        cascade: true
      tagline:
        type: text
        label: Tagline
        comment: Sits under the site name in the footer.
        cascade: true
      logo:
        type: image
        label: Header logo
        comment: SVG or PNG. Leave blank to show the site name as text instead.
        cascade: true
      logo_alt:
        type: text
        label: Logo alt text
        comment: Describes the logo for screen readers.
        cascade: true
      header_cta:
        type: object
        label: Header button
        cascade: true
      navigation:
        type: array
        options:
          structures: _structures.nav_items
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Header menu
        cascade: true
      children:
        type: array
        options:
          structures: _structures.nav_items
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Submenu
        cascade: true
      footer_columns:
        type: array
        options:
          structures: _structures.footer_columns
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Footer columns
        cascade: true
      links:
        type: array
        options:
          structures: _structures.menu_links
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Links
        cascade: true
      contact:
        type: object
        label: Contact details
        cascade: true
      email:
        type: email
        cascade: true
      phone:
        type: text
        cascade: true
      address:
        type: text
        cascade: true
      social:
        type: array
        options:
          structures: _structures.social_links
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        label: Social links
        cascade: true
      url:
        type: url
        cascade: true
      href:
        type: text
        comment: A path like /about/ or a full https:// URL.
        cascade: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
collection_groups:
  - heading: Content
    collections:
      - pages
      - posts
  - heading: Header & Footer
    collections:
      - site
_structures:
  nav_items:
    style: select
    values:
      - default: false
        icon: link
        label: Link
        place_groups_below: false
        tabbed: false
        value:
          label: New link
          href: /
      - default: false
        icon: expand_more
        label: Dropdown
        place_groups_below: false
        tabbed: false
        value:
          label: New menu
          href: /
          children:
            - label: New link
              href: /
  menu_links:
    style: select
    values:
      - default: false
        icon: link
        label: Link
        place_groups_below: false
        tabbed: false
        value:
          label: New link
          href: /
  footer_columns:
    style: select
    values:
      - default: false
        icon: view_column
        label: Column
        place_groups_below: false
        tabbed: false
        value:
          title: New column
          links:
            - label: New link
              href: /
  breadcrumb_items:
    style: select
    values:
      - default: false
        icon: chevron_right
        label: Crumb
        place_groups_below: false
        tabbed: false
        value:
          label: New crumb
          href: /
  trust_items:
    style: select
    values:
      - default: false
        icon: verified
        label: Trust item
        place_groups_below: false
        tabbed: false
        value:
          text: New trust item
  cards:
    style: select
    values:
      - default: false
        icon: crop_square
        label: Card
        place_groups_below: false
        tabbed: false
        value:
          title: New card
          description: ''
          href: /contact/
          link_text: Learn More
  team_members:
    style: select
    values:
      - default: false
        icon: person
        label: Team member
        place_groups_below: false
        tabbed: false
        value:
          name: New member
          role: Role
  social_links:
    style: select
    values:
      - default: false
        icon: share
        label: Social link
        place_groups_below: false
        tabbed: false
        value:
          platform: twitter
          url: https://
editor:
  default_path: /
timezone: Etc/UTC
