# =============================================================================
# CloudCannon configuration — sites/test-3.com (Erick's Tree Service)
# =============================================================================
# This is a bun + Turborepo monorepo, so the CloudCannon Site is connected with
# its Source left at the REPOSITORY ROOT: `bun install` has to run from here for
# the `workspace:*` dependencies on @astro-fleet/shared-ui and @astro-fleet/config
# to resolve. Every path below therefore carries the sites/test-3.com/ prefix.
#
# Mirror these in Site Settings -> Build -> Command line options:
#   Install command: bun install --frozen-lockfile
#   Build command:   bun run turbo build --filter=test-3.com
#   Output path:     sites/test-3.com/dist/client
#   Node version:    22
# bun is not in CloudCannon's build image; /.cloudcannon/preinstall installs it.
#
# OUTPUT PATH IS dist/client, NOT dist. The Cloudflare adapter is loaded for the
# one on-demand route (POST /api/quote), which splits the build into
# dist/client (every prerendered page) and dist/server (the worker). CloudCannon
# serves the former; Cloudflare runs the latter.
#
# MEDIA: photographs live in the Cloudflare R2 bucket, linked as a DAM under
# Site Settings -> Assets, so uploads never enter git. SVG icons and the logo
# stay in the repo under public/media — they are 2 KB files that gain nothing
# from a second origin, and one is used as a CSS mask-image.
# =============================================================================

timezone: America/New_York

paths:
  static: sites/test-3.com/public
  uploads: sites/test-3.com/public/media

collection_groups:
  - heading: Pages
    collections:
      - homepage
      - pages
  - heading: Content
    collections:
      - services
      - locations
      - posts
  - heading: Global Sections
    collections:
      - global
  - heading: Header & Footer
    collections:
      - chrome
  - heading: Forms
    collections:
      - forms
      - submissions
  - heading: Settings
    collections:
      - settings

collections_config:
  # ---------------------------------------------------------------------------
  # Homepage — a singleton. Every section of / lives in this one file.
  # ---------------------------------------------------------------------------
  homepage:
    name: Homepage
    path: sites/test-3.com/src/content/homepage
    glob:
      - '*.json'
    url: '{permalink}'
    icon: home
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data

  # ---------------------------------------------------------------------------
  # Pages — one JSON file per hand-built route in src/pages/.
  # Adding a file here creates no route, so creation is disabled.
  # ---------------------------------------------------------------------------
  pages:
    name: Pages
    path: sites/test-3.com/src/content/pages
    glob:
      - '*.json'
    url: '{permalink}'
    icon: web
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data
    preview:
      text:
        - key: seo.title
        - key: permalink

  # ---------------------------------------------------------------------------
  # Services — the source of truth for every services grid on the site.
  # FILENAME IS THE SLUG: tree-removal.md becomes /service/tree-removal/.
  # ---------------------------------------------------------------------------
  services:
    name: Services
    path: sites/test-3.com/src/content/services
    glob:
      - '**/*.md'
    url: '/service/[full_slug]/'
    icon: forest
    _enabled_editors:
      - visual
      - content
    add_options:
      - name: Add New Service
        schema: default
        icon: add_circle
    schemas:
      default:
        name: New Service
        path: .cloudcannon/schemas/test-3-service.md
    create:
      path: '[relative_base_path]/{title|slugify|lowercase}.md'
    preview:
      text:
        - key: title
      gallery:
        fit: cover
        image:
          - key: card.image
      metadata:
        - icon: sell
          text:
            - template: '{categories[*]}'
            - No categories
    _inputs:
      order:
        type: number
        comment: Ascending sort within every grid this service appears in.
      categories:
        type: multiselect
        comment: Which of the two services pages this appears on.
        options:
          values:
            - residential
            - commercial
      group:
        type: select
        comment: Splits the two grids that the residential page stacks.
        options:
          values:
            - tree-care
            - outdoor-solutions

  # ---------------------------------------------------------------------------
  # Service Areas — one file per CITY. The state and county pages above it are
  # generated by grouping these, so adding a town creates every URL level, the
  # header submenu column and the hub card in one entry.
  # ---------------------------------------------------------------------------
  locations:
    name: Service Areas
    path: sites/test-3.com/src/content/locations
    glob:
      - '**/*.md'
    url: '/locations/{stateSlug}/{countySlug}/[full_slug]/'
    icon: location_city
    _enabled_editors:
      - visual
      - content
    add_options:
      - name: Add New Town
        schema: default
        icon: add_location
    schemas:
      default:
        name: New Town
        path: .cloudcannon/schemas/test-3-location.md
    create:
      path: '[relative_base_path]/{title|slugify|lowercase}.md'
    preview:
      text:
        - key: title
      metadata:
        - icon: map
          text:
            - template: '{county}, {stateAbbr}'
            - No county
    _inputs:
      stateSlug:
        type: text
        comment: URL segment for the state — lowercase, hyphenated. Changing it moves every page under this town.
      countySlug:
        type: text
        comment: URL segment for the county — lowercase, hyphenated.
      stateAbbr:
        type: text
        comment: Postal abbreviation shown on cards and in titles, e.g. CT.

  # ---------------------------------------------------------------------------
  # Blog posts.
  # ---------------------------------------------------------------------------
  posts:
    name: Blog Posts
    path: sites/test-3.com/src/content/posts
    glob:
      - '**/*.md'
    url: '/blog/[full_slug]/'
    icon: newspaper
    _enabled_editors:
      - content
      - visual
    add_options:
      - name: Add New Post
        schema: default
        icon: post_add
        editor: content
    schemas:
      default:
        name: New Post
        path: .cloudcannon/schemas/test-3-post.md
    create:
      path: '[relative_base_path]/{title|slugify|lowercase}.md'
    preview:
      text:
        - key: title
      gallery:
        fit: cover
        image:
          - key: image
      metadata:
        - icon: calendar_month
          text:
            - template: '{date|date_long}'
            - No date
    _inputs:
      draft:
        type: switch
        comment: Drafts are excluded from the build.

  # ---------------------------------------------------------------------------
  # Global Sections — each of these renders identically on every page that uses
  # it. Editing one here changes it everywhere; there is no per-page copy.
  # ---------------------------------------------------------------------------
  global:
    name: Global Sections
    path: sites/test-3.com/src/content/global
    glob:
      - '*.json'
    icon: public
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

  # ---------------------------------------------------------------------------
  # Header & Footer — the site chrome, shared by every page.
  # ---------------------------------------------------------------------------
  chrome:
    name: Header & Footer
    path: sites/test-3.com/src/content/settings
    glob:
      - 'header-footer.json'
    icon: view_agenda
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

  # ---------------------------------------------------------------------------
  # Forms — one file per reusable form definition, dropped into any page.
  # ---------------------------------------------------------------------------
  forms:
    name: Forms
    path: sites/test-3.com/src/content/forms
    glob:
      - '*.json'
    icon: assignment
    disable_url: true
    disable_add_folder: true
    preview:
      text:
        - key: name
    _inputs:
      name:
        type: text
        comment: Label for this list only — never rendered on the page.
      action:
        type: text
        comment: Endpoint the form posts to. /api/quote stores the lead and emails it.
      fields:
        type: array
        label: Form fields
        options:
          structures: _structures.form_fields

  # ---------------------------------------------------------------------------
  # Form Submissions — written by POST /api/quote, read-only here.
  # ---------------------------------------------------------------------------
  submissions:
    name: Form Submissions
    path: sites/test-3.com/src/content/submissions
    glob:
      - '**/*.md'
    icon: inbox
    disable_url: true
    disable_add: true
    disable_add_folder: true
    preview:
      text:
        - key: name
      metadata:
        - icon: mail
          text:
            - key: email
        - icon: schedule
          text:
            - key: received

  # ---------------------------------------------------------------------------
  # Settings — business identity, SEO patterns, theme, and the copy shared by
  # every generated locations page.
  # ---------------------------------------------------------------------------
  settings:
    name: Site Settings
    path: sites/test-3.com/src/content/settings
    glob:
      - 'site.json'
      - 'locations.json'
    icon: settings
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _inputs:
      siteUrl:
        type: url
        comment: Canonical origin. Every canonical tag, og:url, sitemap entry and robots.txt line follows it. Takes effect on the next build.
      mediaBaseUrl:
        type: url
        comment: Public origin of the R2 media bucket. Must match the Base URL of the linked DAM under Site Settings -> Assets.
      turnstileSiteKey:
        type: text
        comment: Public Turnstile key for form spam protection. The secret half is a worker secret, not stored here.

# -----------------------------------------------------------------------------
# Inputs that apply wherever a key of that name appears.
#
# PHOTOGRAPHS go to the R2 DAM (Site Settings -> Assets), which writes a fully
# qualified bucket URL. shared-ui resolves that back to an object key and
# optimises it at build time exactly like the older `r2:` values, so both
# notations produce the same AVIF/WebP/JPEG ladder. If an editor picks "Site
# files" instead, the paths below keep the upload next to the existing repo
# photographs rather than dropping it in public/.
#
# ICONS stay in the repo: /media/icons/... is copied verbatim, and one is used
# as a CSS mask-image.
# -----------------------------------------------------------------------------
_inputs:
  permalink:
    type: text
    label: Output URL
    comment: The live URL of this page. Editing it will not move the route — that lives in src/pages/.
    disabled: true

  # --- photographs ---
  image:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  src:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  heroImage:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  introImage:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  permitImage:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  backgroundImage:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  backgroundImageMobile:
    type: image
    label: Background image (mobile)
    comment: Art-directed crop used below the tablet breakpoint.
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  fallbackImage:
    type: image
    comment: Used for any post that has no image of its own.
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos
  avatarSrc:
    type: image
    options:
      paths:
        static: sites/test-3.com
        uploads: sites/test-3.com/src/assets/photos

  # --- repo icons and logo ---
  icon:
    type: image
    comment: SVG or small PNG. Icons belong in the repo, not in the media bucket.
  logo:
    type: image
  favicon:
    type: image
  alertIconSrc:
    type: image
  sourceSrc:
    type: image
  starsSrc:
    type: image
  verifiedSrc:
    type: image

  # --- alt text sits next to every image ---
  imageAlt:
    type: textarea
    comment: Describes the image for screen readers and for search.
  alertIconAlt:
    type: text
  imageSplit:
    type: text
    comment: Percentage width of the image half of a split hero, e.g. 56.72%.

  # --- recurring arrays ---
  paragraphs:
    type: array
    comment: One paragraph per entry.
  bullets:
    type: array
  keywords:
    type: array
    comment: SEO keywords for this page.

# -----------------------------------------------------------------------------
# Shapes offered by the "+ Add" button on the arrays above.
# -----------------------------------------------------------------------------
_structures:
  form_fields:
    values:
      - label: Text
        icon: text_fields
        value:
          name: new_field
          type: text
          label: New field
          placeholder: ''
          required: false
      - label: Email
        icon: alternate_email
        value:
          name: email
          type: email
          label: Email Address
          placeholder: ''
          required: true
      - label: Phone
        icon: phone
        value:
          name: phone
          type: tel
          label: Phone Number
          placeholder: ''
          required: true
      - label: Long text
        icon: notes
        value:
          name: message
          type: textarea
          label: Message
          placeholder: ''
          required: false
      - label: Dropdown
        icon: arrow_drop_down_circle
        value:
          name: service
          type: select
          label: Service
          required: false
          options:
            - First option
      - label: Radio group
        icon: radio_button_checked
        value:
          name: project_type
          type: radio
          label: Project Type
          required: false
          options:
            - First option
