      - { label: Body Button Link, name: bodyCtaHref, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false, hint: 'Long-form content. Use H2 for the section headings.' }

  # -------------------------------------------------------------------------
  # Forms — a content model of their own, so a form can be authored once and
  # reused on any page. One JSON file per form; the FILENAME is the id a page
  # looks it up by (quote.json → getForm('quote') in src/lib/forms.ts), so
  # renaming a form's title never breaks a page. Editors can add new forms and
  # edit every field's label, placeholder and type.
  # -------------------------------------------------------------------------
  - name: forms
    label: Forms
    label_singular: Form
    folder: sites/test-2.com/src/content/forms
    create: true
    delete: true
    extension: json
    format: json
    # Filename is generated from the form name on creation only — Sveltia keeps
    # the original slug when the name is edited later, so ids stay stable.
    slug: '{{fields.name | slugify}}'
    identifier_field: name
    summary: '{{fields.name}} → {{fields.action}}'
    editor: { preview: false }
    fields:
      - { label: Form Name, name: name, widget: string, hint: 'Internal label — also becomes the file name for a new form.' }
      - { label: Title, name: title, widget: string, hint: 'Heading shown above the form.' }
      - { label: Subtitle, name: subtitle, widget: text, required: false }
      - { label: Submit Button Text, name: submitText, widget: string }
      - { label: Action / Endpoint, name: action, widget: string, default: /api/quote, hint: 'Where submissions are posted. Leads land in Form Submissions.' }
      - label: Fields
        name: fields
        widget: list
        summary: '{{fields.label}} ({{fields.type}})'
        fields:
          - { label: Field Name (key), name: name, widget: string, hint: 'Key the value is submitted under — e.g. full_name.' }
          - { label: Type, name: type, widget: select, options: [text, email, tel, textarea, select, radio], default: text, hint: 'tel fields get country detection and phone validation automatically.' }
          - { label: Label, name: label, widget: string, required: false }
          - { label: Placeholder, name: placeholder, widget: string, required: false }
          - { label: Required, name: required, widget: boolean, default: false, required: false }
          - { label: Options (select/radio), name: options, widget: list, required: false, hint: 'Only applies to select and radio field types.', field: { label: Option, name: option, widget: string } }

  # -------------------------------------------------------------------------
  # Form submissions (leads) — written by the /api/quote function. Read-only.
  # -------------------------------------------------------------------------
  - name: submissions
    label: Form Submissions
    label_singular: Submission
    folder: sites/test-2.com/src/content/submissions
    create: false
    delete: true
    extension: md
    format: frontmatter
    summary: '{{fields.name}} — {{fields.form}} ({{fields.received}})'
    fields:
      - { label: Form, name: form, widget: string }
      - { label: Name, name: name, widget: string }
      - { label: Email, name: email, widget: string }
      - { label: Phone, name: phone, widget: string }
      - { label: Project Type, name: project_type, widget: string, required: false }
      - { label: Service, name: service, widget: string, required: false }
      - { label: Received, name: received, widget: datetime, required: false }
      - { label: Message, name: body, widget: text, required: false }

  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: sites/test-2.com/src/content/posts
    create: true
    slug: '{{fields.title | slugify}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: imageAlt, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }
