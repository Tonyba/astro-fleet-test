  # -------------------------------------------------------------------------
  # Single Service — the source of truth for every service on the site.
  # One entry per service. The FILENAME is the slug its detail page is built at
  # (tree-removal.md -> /service/tree-removal/), and every services grid on the
  # site (homepage, /services/commercial/, /services/residential/) is generated
  # from this collection, so a card and its page can never drift apart.
  #
  # Taxonomy: `categories` places a service under Residential and/or Commercial;
  # `group` picks which of the two grids it lands in on the residential page.
  # Keep in sync with the `services` collection in src/content.config.ts.
  # -------------------------------------------------------------------------
  - name: services
    label: Single Service
    label_singular: Service
    folder: sites/test-2.com/src/content/services
    create: true
    slug: '{{fields.title | slugify}}'
    extension: md
    format: frontmatter
    summary: '{{fields.title}} — {{fields.group}}'
    sortable_fields: [order, title]
    view_groups:
      - { label: Group, field: group }
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string, hint: 'Also becomes the URL slug for a new service, e.g. Tree Removal -> /service/tree-removal/.' }
      - { label: Order, name: order, widget: number, default: 0, value_type: int, hint: 'Ascending — controls position within a services grid.' }
      - label: Categories
        name: categories
        widget: select
        multiple: true
        default: [residential]
        options:
          - { label: Residential, value: residential }
          - { label: Commercial, value: commercial }
        hint: 'Which services pages this service appears on. Pick both if it applies to both.'
      - label: Grid
        name: group
        widget: select
        default: tree-care
        options:
          - { label: Tree Services, value: tree-care }
          - { label: Outdoor Solutions, value: outdoor-solutions }
