                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Sub-label, name: sublabel, widget: string, required: false }
                  - { label: Link, name: href, widget: string }
              - label: Phone
                name: phone
                widget: object
                fields:
                  - { label: Label, name: label, widget: string, required: false }
                  - { label: Number, name: number, widget: string }
              - { label: Background Image (desktop), name: backgroundImage, widget: image }
              - { label: Background Image (mobile/tablet), name: backgroundImageMobile, widget: image }
              - label: Trust Badges
                name: badges
                widget: list
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Alt, name: alt, widget: string }
                  - { label: Width, name: width, widget: number }
                  - { label: Height, name: height, widget: number }
          - label: Services
            name: services
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              # Service cards are generated from the Single Service collection below —
              # edit a card by editing its service there, not here.
          - label: Why Choose Us
            name: whyChoose
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Feature Cards
                name: items
                widget: list
                fields:
                  # Rendered as a CSS mask-image — must resolve to a public URL.
                  - { label: Icon, name: icon, widget: image, media_folder: /sites/test-2.com/public/media/icons, public_folder: /media/icons }
