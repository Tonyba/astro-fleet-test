# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------
# Sveltia is a GIT-BASED CMS: it commits content straight back to your repo.
# For production, switch to the github backend and point it at your repo. The
# paths below are relative to the REPOSITORY ROOT — this is a monorepo, so every
# path is prefixed with sites/test-2.com/.
backend:
  name: github
  repo: tonyba/astro-fleet-test        # TODO: change to your real GitHub repo (only used for the remote/production backend)
  branch: staging

# ---------------------------------------------------------------------------
# Local development
# ---------------------------------------------------------------------------
# With this flag set, opening the admin on localhost lets you edit files
# directly on disk via the File System Access API — no OAuth, no proxy server
# (a Sveltia-only convenience over Decap/Netlify CMS). Works in Chrome/Edge.
# When prompted, pick the MONOREPO ROOT folder (the one containing sites/).
local_backend: true

# ---------------------------------------------------------------------------
# Media
# ---------------------------------------------------------------------------
# Photographs are BUILD INPUTS, not static files: they land in src/assets so
# Astro's <Picture /> (see TreePicture.astro) can emit AVIF + WebP + a JPEG
# fallback at the widths each slot needs. public/ is copied verbatim and is
# therefore reserved for SVG icons and the logo, which have their own
# media_folder overrides on the fields below.
#
# The stored value is `/src/assets/<file>`; TreePicture resolves that string to
# the imported asset, so a CMS upload renders through exactly the same pipeline
# as a hand-placed photo.
media_folder: sites/test-2.com/src/assets   # where uploads are stored (repo path)
public_folder: /src/assets                  # the path written into content

media_libraries:
  all:
    # 1 MB is the repo budget enforced by scripts/check-file-sizes.mjs. Uploads
    # are transcoded and capped below before they are committed, so an oversized
    # camera original cannot land in the repo and break the build.
    max_file_size: 8388608
    slugify_filename: true
    transformations:
      raster_image: # original format
        format: webp # new format, only `webp` is supported
        quality: 90 # matches the quality <Picture /> renders at
        width: 1920 # widest slot in the design (full-bleed hero)
        height: 1920
      svg:
        optimize: true

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  # -------------------------------------------------------------------------
  # Site Settings — global chrome (logo, header, footer, contact, theme).
  # Reused across every page of the site.
  # -------------------------------------------------------------------------
  - name: settings
    label: Site Settings
    editor: { preview: false }
    files:
      - name: site
        label: Site
        file: sites/test-2.com/src/content/settings/site.json
        fields:
          # Single source of truth for the domain. astro.config.mjs reads it into
          # `site`, so canonical, og:url, the sitemap and robots.txt all follow.
          # Changing it requires a rebuild (or a dev-server restart).
          - { label: Site URL, name: siteUrl, widget: string, pattern: ['^https?://[^/]+$', 'Full origin with no trailing slash, e.g. https://www.example.com'] }
          - { label: Site Name, name: siteName, widget: string }
          # Logos and icons stay in public/ as-is: they are vectors (or flat
          # raster marks), not photographs, and never go through <Picture />.
          - { label: Logo, name: logo, widget: image, media_folder: /sites/test-2.com/public/media, public_folder: /media }
          - label: Theme
            name: theme
            widget: object
            fields:
              - label: Colors
                name: colors
                widget: object
                fields:
                  - { label: Text Primary, name: textPrimary, widget: color }
                  - { label: Text Accent, name: textAccent, widget: color }
                  - { label: Brand, name: bgBrand, widget: color }
                  - { label: Brand Strong, name: bgBrandStrong, widget: color }
                  - { label: Accent, name: bgAccent, widget: color }
                  - { label: Action, name: bgAction, widget: color }
                  - { label: Action Hover, name: bgActionHover, widget: color }
                  - { label: Emergency, name: bgEmergency, widget: color }
              - label: Fonts
                name: fonts
                widget: object
                fields:
                  - { label: Font Family, name: sans, widget: string }
          - label: Header
            name: header
            widget: object
            fields:
              - label: Navigation
                name: navigation
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Dropdown caret, name: caret, widget: boolean, required: false, default: false }
              - label: Phone
                name: phone
                widget: object
                fields:
                  - { label: Number, name: number, widget: string }
                  - { label: Label, name: label, widget: string, required: false }
              - { label: CTA Text, name: ctaText, widget: string }
              - { label: CTA Link, name: ctaHref, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Description, name: description, widget: text }
              - label: Trust Badges
                name: badges
                widget: list
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Alt, name: alt, widget: string }
                  - { label: Width, name: width, widget: number }
                  - { label: Height, name: height, widget: number }
              - label: Social Links
                name: social
                widget: list
                fields:
                  - { label: Platform, name: platform, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Icon, name: icon, widget: image, media_folder: /sites/test-2.com/public/media/icons, public_folder: /media/icons }
              - label: Link Columns
                name: columns
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - label: Links
                    name: links
                    widget: list
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
              - label: Contact
                name: contact
                widget: object
                fields:
                  - { label: Phone, name: phone, widget: string }
                  - { label: Email, name: email, widget: string }
                  - { label: Address, name: address, widget: string }
              - label: Emergency
                name: emergency
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Number, name: number, widget: string }
              - { label: Copyright, name: copyright, widget: string }
              - label: Legal Links
                name: legalLinks
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

  # -------------------------------------------------------------------------
  # Homepage — per-section editable content.
  # -------------------------------------------------------------------------
  - name: homepage
    label: Homepage
    editor: { preview: false }
    files:
      - name: home
        label: Home
        file: sites/test-2.com/src/content/homepage/home.json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Keywords, name: keywords, widget: list, field: { label: Keyword, name: keyword, widget: string } }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Review Text, name: reviewText, widget: string }
              - { label: Subcopy, name: subcopy, widget: text }
              - { label: Bullets, name: bullets, widget: list, field: { label: Bullet, name: bullet, widget: string } }
              - label: Primary CTA
